<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romain Gillet — Portfolio Photo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0e0e0e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 50px 20px;
    }
    header { text-align: center; margin-bottom: 30px; }
    h1 { font-weight: 300; letter-spacing: 3px; font-size: 1.8rem; }
    p.sub { color: #999; margin-top: 8px; font-size: 0.95rem; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 40px;
    }
    .filters button {
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #333;
      padding: 8px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .filters button:hover {
      border-color: #666;
      color: #fff;
    }
    .filters button.active {
      background: #fff;
      color: #0e0e0e;
      border-color: #fff;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .gallery figure {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background: #1a1a1a;
      cursor: pointer;
      aspect-ratio: 3 / 2;
    }
    .gallery figure.hidden { display: none; }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery figure:hover img { transform: scale(1.04); }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    #lightbox.active { display: flex; }
    #lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 4px;
    }
    #lightbox-caption {
      position: absolute;
      bottom: 25px;
      left: 0;
      right: 0;
      text-align: center;
      color: #ccc;
      font-size: 0.9rem;
    }
    #lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }
    #lightbox-prev, #lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #fff;
      font-size: 2.5rem;
      cursor: pointer;
      padding: 10px 18px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    #lightbox-prev:hover, #lightbox-next:hover { opacity: 1; }
    #lightbox-prev { left: 10px; }
    #lightbox-next { right: 10px; }

    footer {
      text-align: center;
      margin-top: 60px;
      color: #666;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ROMAIN GILLET</h1>
    <p class="sub">Photographie animalière &amp; paysage</p>
  </header>

  <div class="filters" id="filters">
    <button data-filter="all" class="active">Tous</button>
    <button data-filter="paysage">Paysage</button>
    <button data-filter="macro">Macro</button>
    <button data-filter="oiseaux">Oiseaux</button>
    <button data-filter="mammiferes">Mammifères</button>
    <button data-filter="insectes">Insectes</button>
  </div>

  <div class="gallery" id="gallery">
    <!--
      Pour chaque photo, ajoute un bloc <figure> comme ci-dessous.
      - data-category sur <figure> : paysage / macro / oiseaux / mammiferes / insectes
      - src : chemin vers photos/nom-du-fichier.jpg
      - alt : description réelle (espèce, lieu) pour l'accessibilité et le référencement
      - data-caption : légende affichée dans la vue agrandie (peut être identique à alt)
    -->
<figure data-category="paysage">
  <img src="photos/PaysageSavoieJuillet2026.jpg" alt="Montagne au ciel rose" loading="lazy" data-caption="Montagne, ciel">
</figure>
<figure data-category="paysage">
  <img src="photos/PaysageSavoieJuillet2026-2.jpg" alt="Levé de soleil sur le lac" loading="lazy" data-caption="Lac">
</figure>
<figure data-category="paysage">
  <img src="photos/PaysageSavoieJuillet2026-3.jpg" alt="Rayon de soleil sur la vallée" loading="lazy" data-caption="Soleil, vallée">
</figure>
    <figure data-category="mammiferes">
  <img src="photos/BouquetinVercors2025.jpg" alt="Bouquetin" loading="lazy" data-caption="Bouquetin, Vercors">
</figure>
<figure data-category="mammiferes">
  <img src="photos/BouquetinVercors2025-2.jpg" alt="Bouquetin" loading="lazy" data-caption="Bouquetin, Vercors">
</figure>
<figure data-category="oiseaux">
  <img src="photos/BouquetinVercors2025-3.jpg" alt="Chocard à bec jaune" loading="lazy" data-caption="Chocard à bec jaune, Vercors">
</figure>
    <figure data-category="insectes">
  <img src="photos/DianeSortieSolidage2025.jpg" alt="Le papillon Diane" loading="lazy" data-caption="La Diane">
</figure>
  </div>

  <footer>&copy; Romain Gillet — Toute reproduction ou utilisation sans autorisation est interdite.</footer>

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lightbox-close" aria-label="Fermer">&times;</button>
    <button id="lightbox-prev" aria-label="Précédent">&#8249;</button>
    <img id="lightbox-img" src="" alt="">
    <button id="lightbox-next" aria-label="Suivant">&#8250;</button>
    <div id="lightbox-caption"></div>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const filterButtons = document.querySelectorAll('.filters button');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const caption = document.getElementById('lightbox-caption');
    let currentIndex = 0;

    // Récupère uniquement les photos actuellement visibles (non filtrées)
    function getVisibleImages() {
      return Array.from(gallery.querySelectorAll('figure:not(.hidden) img'));
    }

    // Filtres
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;

        gallery.querySelectorAll('figure').forEach(fig => {
          if (filter === 'all' || fig.dataset.category === filter) {
            fig.classList.remove('hidden');
          } else {
            fig.classList.add('hidden');
          }
        });
      });
    });

    // Lightbox
    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add('active');
    }

    function updateLightbox() {
      const images = getVisibleImages();
      const img = images[currentIndex];
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      caption.textContent = img.dataset.caption || img.alt;
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    gallery.addEventListener('click', (e) => {
      const figure = e.target.closest('figure');
      if (!figure || figure.classList.contains('hidden')) return;
      const images = getVisibleImages();
      const clickedImg = figure.querySelector('img');
      const index = images.indexOf(clickedImg);
      if (index !== -1) openLightbox(index);
    });

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-prev').addEventListener('click', () => {
      const images = getVisibleImages();
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateLightbox();
    });
    document.getElementById('lightbox-next').addEventListener('click', () => {
      const images = getVisibleImages();
      currentIndex = (currentIndex + 1) % images.length;
      updateLightbox();
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
      if (e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
    });

    // Empêche le clic droit (menu "Enregistrer l'image") et le glisser-déposer
    // sur toutes les images du site, y compris dans la lightbox.
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('contextmenu', (e) => e.preventDefault());
      img.addEventListener('dragstart', (e) => e.preventDefault());
    });
  </script>

</body>
</html>
